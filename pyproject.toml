[project]
name = "chattersyn"
version = "0.3.1"
description = "Chatterino-style dual chat client: Twitch + YouTube live chat, one input posts to both"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "qasync>=0.28,<0.29",
    "websockets>=13",
    "httpx>=0.27",
    "google-api-python-client>=2.200",
    "google-auth-oauthlib>=1.4.1",
    "google-auth-httplib2>=0.2",
    "grpcio>=1.66",
    "protobuf>=5.26,<6",
    "keyring>=25",
    "regex>=2026.9.29",
]

[project.scripts]
chattersyn = "chattersyn.app:run"

[dependency-groups]
dev = [
    "emoji>=2.16.0",
    "grpcio-tools>=1.71.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.12,<7", "pillow>=10.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chattersyn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Not relying on the editable install: the sandboxed shell sets UF_HIDDEN on
# files it creates, and Python 3.13 skips hidden .pth files.
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Launcher scripts must set up sys.path + the venv self-heal before imports.
"scripts/*.py" = ["E402"]
# protoc-generated code: long lines, wildcard imports, object inheritance,
# delayed imports (version check), and split f-strings are all by design.
"src/chattersyn/services/youtube/stream_list_pb2.py" = [
    "E501",
    "E402",
    "F401",
    "F403",
    "I001",
    "UP004",
]
"src/chattersyn/services/youtube/stream_list_pb2_grpc.py" = [
    "E501",
    "F401",
    "F541",
    "I001",
    "UP004",
]
