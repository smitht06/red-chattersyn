name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Per-ref AND per-event: a workflow_dispatch smoke test must not cancel
  # (or be cancelled by) a regular push run on the same ref.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35): runs on Linux Mint 21+, our Linux target.
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (ubuntu GUI libs for Qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0

      - run: uv sync --group build --locked

      - name: Stamp version
        shell: bash  # Windows defaults to pwsh, where $GITHUB_ENV would not append
        run: |
          echo "APP_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")" >> "$GITHUB_ENV"

      - name: Generate icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/make_icon.py

      - name: Build
        run: uv run pyinstaller --noconfirm chattersyn.spec

      - name: Sign (macOS ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/chattersyn.app

      - name: Smoke test (12s --demo, must stay alive)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/chattersyn.app/Contents/MacOS/chattersyn
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/chattersyn/chattersyn.exe
          else BIN=dist/chattersyn/chattersyn; fi
          "$BIN" --demo & APP_PID=$!
          sleep 12
          if ! kill -0 $APP_PID 2>/dev/null; then wait $APP_PID; echo "app exited early"; exit 1; fi
          kill $APP_PID; wait $APP_PID 2>/dev/null || true
          echo "smoke OK"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/chattersyn.app "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.tar.gz" -C dist chattersyn

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: uv run python scripts/build_deb.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\chattersyn -DestinationPath "dist\chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}
          path: dist/chattersyn-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  apt-repo:
    # Publish the Linux .deb into the APT repository. The GPG-signed index
    # (dists/stable) deploys to Cloudflare Pages; the .deb itself is a GitHub
    # *release* asset (2 GB limit), reached via a Pages _redirects rule — it
    # exceeds both GitHub's 100 MB git limit and Pages' 25 MB per-file limit,
    # so it can't be committed or served directly. Users add the source once;
    # afterwards `apt update && apt upgrade` delivers new releases. Also runs
    # on workflow_dispatch for smoke tests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, download LAST: a checkout run after the download
      # deleted artifacts/ despite clean: false (sparse-checkout worktree
      # update), so nothing git-flavored may run between the download and
      # the steps that read it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # No `pattern`: download all artifacts merged flat, exactly like the
          # release job. The `pattern` input was silently matching nothing.
          path: artifacts
          merge-multiple: true

      - name: Locate deb
        id: deb
        run: |
          echo "--- artifacts/ tree ---"
          find artifacts -type f | sort || true
          deb="$(find artifacts -name 'chattersyn-*-linux-x86_64.deb' | head -1)"
          if [ -z "$deb" ]; then
            echo "FATAL: no chattersyn-*-linux-x86_64.deb under artifacts/" >&2
            exit 1
          fi
          deb="$(realpath "$deb")"   # absolute, so it survives a later `cd`
          ver="$(basename "$deb" | sed 's/^chattersyn-//; s/-linux-x86_64\.deb$//')"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Assemble APT repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ver="${{ steps.deb.outputs.ver }}"
          deb="${{ steps.deb.outputs.deb }}"
          root="$RUNNER_TEMP/aptrepo"
          deb_name="chattersyn-${ver}-linux-x86_64.deb"
          # The .deb is NOT copied into the published tree — it's a GitHub
          # *release* asset, reached via a Cloudflare Pages redirect
          # (_redirects) that rewrites the relative pool/ path apt requests.
          # We still pass the artifact here so gen_apt_index.py hashes it for
          # the Size/SHA256 the index publishes (they must describe the exact
          # bytes apt downloads via the redirect). Filename stays relative:
          # apt treats it as relative to the repository base.
          # Writes Packages, Packages.gz and Release. Not apt-ftparchive:
          # on ubuntu-24.04 it silently indexed nothing and published an
          # empty (but validly signed!) Release file.
          python3 scripts/gen_apt_index.py \
              "$deb" "pool/main/c/chattersyn/$deb_name" "$root"
          cd "$root"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor \
              -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign \
              -o dists/stable/InRelease dists/stable/Release
          # Public half of the signing key, published at the repo root so
          # users can fetch it as a stable URL for /etc/apt/keyrings.
          gpg --batch --yes --armor --export \
              "ChatterSyn APT Repository" > "$root/chattersyn.gpg"
          # Install instructions + the deb redirect rule at the repo root.
          cp "$GITHUB_WORKSPACE/apt/README.md" "$root/README.md"
          cp "$GITHUB_WORKSPACE/apt/_redirects" "$root/_redirects"
          echo "aptrepo=$root" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the Pages project name, so the site lives at
          # https://chattersyn-apt.pages.dev (README install instructions
          # point there). Rename here + in apt/README.md to move it.
          projectName: chattersyn-apt
          directory: ${{ env.aptrepo }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-repo-index
          path: ${{ env.aptrepo }}/dists
          if-no-files-found: ignore
