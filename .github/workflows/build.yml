name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Per-ref AND per-event: a workflow_dispatch smoke test must not cancel
  # (or be cancelled by) a regular push run on the same ref.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35): runs on Linux Mint 21+, our Linux target.
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (ubuntu GUI libs for Qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0

      - run: uv sync --group build --locked

      - name: Stamp version
        shell: bash  # Windows defaults to pwsh, where $GITHUB_ENV would not append
        run: |
          echo "APP_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")" >> "$GITHUB_ENV"

      - name: Generate icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/make_icon.py

      - name: Build
        run: uv run pyinstaller --noconfirm chattersyn.spec

      - name: Sign (macOS ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/chattersyn.app

      - name: Smoke test (12s --demo, must stay alive)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/chattersyn.app/Contents/MacOS/chattersyn
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/chattersyn/chattersyn.exe
          else BIN=dist/chattersyn/chattersyn; fi
          "$BIN" --demo & APP_PID=$!
          sleep 12
          if ! kill -0 $APP_PID 2>/dev/null; then wait $APP_PID; echo "app exited early"; exit 1; fi
          kill $APP_PID; wait $APP_PID 2>/dev/null || true
          echo "smoke OK"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/chattersyn.app "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.tar.gz" -C dist chattersyn

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: uv run python scripts/build_deb.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\chattersyn -DestinationPath "dist\chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}
          path: dist/chattersyn-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  apt-repo:
    # Publish the Linux .deb into the APT repository served from GitHub Pages
    # (repo smitht06/red-chattersyn-apt): pool/ + a GPG-signed dists/stable
    # index. Users add the source once; afterwards `apt update && apt upgrade`
    # delivers new releases. Also runs on workflow_dispatch for smoke tests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, download LAST: a checkout run after the download
      # deleted artifacts/ despite clean: false (sparse-checkout worktree
      # update), so nothing git-flavored may run between the download and
      # the steps that read it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # No `pattern`: download all artifacts merged flat, exactly like the
          # release job. The `pattern` input was silently matching nothing.
          path: artifacts
          merge-multiple: true

      - name: Locate deb
        id: deb
        run: |
          echo "--- artifacts/ tree ---"
          find artifacts -type f | sort || true
          deb="$(find artifacts -name 'chattersyn-*-linux-x86_64.deb' | head -1)"
          if [ -z "$deb" ]; then
            echo "FATAL: no chattersyn-*-linux-x86_64.deb under artifacts/" >&2
            exit 1
          fi
          ver="$(basename "$deb" | sed 's/^chattersyn-//; s/-linux-x86_64\.deb$//')"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Assemble APT repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ver="${{ steps.deb.outputs.ver }}"
          # The .deb (~136 MB) exceeds GitHub's 100 MB per-file git limit, so
          # it is NOT committed here: it lives as a GitHub release asset on
          # the (public) main repo, and the Packages index points apt at it
          # via an absolute Filename URL.
          rel_tag="$GITHUB_REF_NAME"
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && rel_tag="v${ver}"
          deb_url="https://github.com/smitht06/red-chattersyn/releases/download/${rel_tag}/chattersyn-${ver}-linux-x86_64.deb"
          # The release job runs in parallel and may still be uploading the
          # asset: wait for the URL before publishing a reference to it.
          # Probe the first hop only (no -L): github.com answers 302 for an
          # existing asset and 404 for a missing one. Following the redirect
          # hits the CDN blob host, which can serve stale 404s (e.g. after a
          # private->public flip) and rejects HEAD outright.
          for _ in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$deb_url")"
            [ "$code" = 302 ] && break
            sleep 10
          done
          [ "$code" = 302 ]
          root="$RUNNER_TEMP/aptrepo"
          mkdir -p "$root"
          # Index the REMOTE deb, not the freshly built one: rebuilds are not
          # byte-identical (embedded timestamps), and hashing the local copy
          # while Filename points at the release asset publishes Size/SHA256
          # that don't match what apt downloads -> "Hash Sum mismatch". The
          # asset is the source of truth on tag pushes and smoke-test
          # dispatches alike.
          curl -fsSL "$deb_url" -o "$root/remote.deb"
          # Writes Packages, Packages.gz and Release. Not apt-ftparchive:
          # on ubuntu-24.04 it silently indexed nothing and published an
          # empty (but validly signed!) Release file.
          python3 scripts/gen_apt_index.py "$root/remote.deb" "$deb_url" "$root"
          rm -f "$root/remote.deb"
          cd "$root"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor \
              -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign \
              -o dists/stable/InRelease dists/stable/Release
          # Public half of the signing key, published at the repo root so
          # users can fetch it as a stable URL for /etc/apt/keyrings.
          gpg --batch --yes --armor --export \
              "ChatterSyn APT Repository" > "$root/chattersyn.gpg"
          # Install instructions at the repo root (Pages/GitHub readme).
          cp "$GITHUB_WORKSPACE/apt/README.md" "$root/README.md"
          echo "aptrepo=$root" >> "$GITHUB_ENV"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.APT_DEPLOY_KEY }}
          external_repository: smitht06/red-chattersyn-apt
          publish_branch: gh-pages
          publish_dir: ${{ env.aptrepo }}
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "apt repo: ${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-repo-index
          path: ${{ env.aptrepo }}/dists
          if-no-files-found: ignore
