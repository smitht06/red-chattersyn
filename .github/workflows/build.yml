name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Per-ref AND per-event: a workflow_dispatch smoke test must not cancel
  # (or be cancelled by) a regular push run on the same ref.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # Lint and the test suite (Qt offscreen). The pyside6-6.11 leg is the
    # PySide6 the Flatpak gets from io.qt.PySide.BaseApp; the app supports
    # both. Not yet a gate for `build`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: lock
            pyside: ""
          - leg: pyside6-6.11
            pyside: "PySide6==6.11.*"
    name: test (${{ matrix.leg }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (ubuntu GUI libs for Qt)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0

      - run: uv sync --locked

      - name: Swap in the Flatpak's PySide6
        if: matrix.pyside != ''
        run: uv pip install "${{ matrix.pyside }}"

      # --no-sync: keep the swapped PySide6 instead of re-syncing to uv.lock.
      - run: uv run --no-sync ruff check src/ tests/ scripts/
      - run: uv run --no-sync pytest -q

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35): runs on Linux Mint 21+, our Linux target.
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (ubuntu GUI libs for Qt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0

      - run: uv sync --group build --locked

      - name: Stamp version
        shell: bash  # Windows defaults to pwsh, where $GITHUB_ENV would not append
        run: |
          echo "APP_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")" >> "$GITHUB_ENV"

      - name: Generate icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/make_icon.py

      - name: Build
        run: uv run pyinstaller --noconfirm chattersyn.spec

      - name: Sign (macOS ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/chattersyn.app

      - name: Smoke test (12s --demo, must stay alive)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/chattersyn.app/Contents/MacOS/chattersyn
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/chattersyn/chattersyn.exe
          else BIN=dist/chattersyn/chattersyn; fi
          "$BIN" --demo & APP_PID=$!
          sleep 12
          if ! kill -0 $APP_PID 2>/dev/null; then wait $APP_PID; echo "app exited early"; exit 1; fi
          kill $APP_PID; wait $APP_PID 2>/dev/null || true
          echo "smoke OK"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/chattersyn.app "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.tar.gz" -C dist chattersyn

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: uv run python scripts/build_deb.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\chattersyn -DestinationPath "dist\chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chattersyn-${{ env.APP_VERSION }}-${{ matrix.artifact }}
          path: dist/chattersyn-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Release candidates (vX.Y.ZrcN) are marked pre-release, so the
          # repo's "Latest" stays on the last stable version. APT and
          # Homebrew still publish them (build_deb maps the deb version to
          # X.Y.Z~rcN so the final release sorts newer).
          prerelease: ${{ contains(github.ref_name, 'rc') }}

  apt-repo:
    # Publish the Linux .deb into the APT repository. The GPG-signed index
    # (dists/stable) deploys to Cloudflare Pages; the .deb itself is a GitHub
    # *release* asset (2 GB limit), reached via a Pages _redirects rule — it
    # exceeds both GitHub's 100 MB git limit and Pages' 25 MB per-file limit,
    # so it can't be committed or served directly. Users add the source once;
    # afterwards `apt update && apt upgrade` delivers new releases. Also runs
    # on workflow_dispatch for smoke tests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, download LAST: a checkout run after the download
      # deleted artifacts/ despite clean: false (sparse-checkout worktree
      # update), so nothing git-flavored may run between the download and
      # the steps that read it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # No `pattern`: download all artifacts merged flat, exactly like the
          # release job. The `pattern` input was silently matching nothing.
          path: artifacts
          merge-multiple: true

      - name: Locate deb
        id: deb
        run: |
          echo "--- artifacts/ tree ---"
          find artifacts -type f | sort || true
          deb="$(find artifacts -name 'chattersyn-*-linux-x86_64.deb' | head -1)"
          if [ -z "$deb" ]; then
            echo "FATAL: no chattersyn-*-linux-x86_64.deb under artifacts/" >&2
            exit 1
          fi
          deb="$(realpath "$deb")"   # absolute, so it survives a later `cd`
          ver="$(basename "$deb" | sed 's/^chattersyn-//; s/-linux-x86_64\.deb$//')"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Probe release asset (first hop, no -L)
        run: |
          set -euo pipefail
          ver="${{ steps.deb.outputs.ver }}"
          url="https://github.com/smitht06/red-chattersyn/releases/download/v${ver}/chattersyn-${ver}-linux-x86_64.deb"
          # First hop only: github.com answers 302 for an existing asset and
          # 404 for a missing one; the CDN blob host can serve stale 404s and
          # rejects HEAD. On a tag push the `release` job uploads the asset in
          # parallel with this job — retry until it appears (or fail after
          # ~10 min; the repo then stays on the previous index, like the tap).
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "302" ]; then
              echo "release asset present (302)"
              exit 0
            fi
            echo "asset not up yet (HTTP $code), retrying in 10s"
            sleep 10
          done
          echo "FATAL: release asset never appeared at $url" >&2
          exit 1

      - name: Download remote release asset
        run: |
          set -euo pipefail
          ver="${{ steps.deb.outputs.ver }}"
          url="https://github.com/smitht06/red-chattersyn/releases/download/v${ver}/chattersyn-${ver}-linux-x86_64.deb"
          mkdir -p "$RUNNER_TEMP/remote"   # mkdir before curl -o writes into it
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 3 -o "$RUNNER_TEMP/remote/chattersyn.deb" "$url"; then
              break
            fi
            echo "download attempt $attempt failed (stale CDN 404?), retrying in 10s"
            sleep 10
          done
          ls -l "$RUNNER_TEMP/remote/chattersyn.deb"

      - name: Assemble APT repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ver="${{ steps.deb.outputs.ver }}"
          deb="$RUNNER_TEMP/remote/chattersyn.deb"
          root="$RUNNER_TEMP/aptrepo"
          deb_name="chattersyn-${ver}-linux-x86_64.deb"
          # The .deb is NOT copied into the published tree — it's a GitHub
          # *release* asset, reached via a Cloudflare Pages redirect
          # (_redirects) that rewrites the relative pool/ path apt requests.
          # gen_apt_index.py hashes the REMOTE release asset downloaded above,
          # never the freshly rebuilt artifact: rebuilds are not byte-identical
          # (embedded timestamps), so hashing the local copy while the redirect
          # serves the release asset publishes Size/SHA256 that don't match
          # what apt downloads -> "Hash Sum mismatch" (bit the live repo on
          # 2026-10-19, and a dispatch smoke test would have re-triggered it —
          # the dispatch path is why the asset is downloaded here). Filename
          # stays relative: apt treats it as relative to the repository base.
          # Writes Packages, Packages.gz and Release. Not apt-ftparchive:
          # on ubuntu-24.04 it silently indexed nothing and published an
          # empty (but validly signed!) Release file.
          python3 scripts/gen_apt_index.py \
              "$deb" "pool/main/c/chattersyn/$deb_name" "$root"
          cd "$root"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor \
              -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign \
              -o dists/stable/InRelease dists/stable/Release
          # Public half of the signing key, published at the repo root so
          # users can fetch it as a stable URL for /etc/apt/keyrings.
          gpg --batch --yes --armor --export \
              "ChatterSyn APT Repository" > "$root/chattersyn.gpg"
          # Install instructions + the deb redirect rule at the repo root.
          cp "$GITHUB_WORKSPACE/apt/README.md" "$root/README.md"
          cp "$GITHUB_WORKSPACE/apt/_redirects" "$root/_redirects"
          echo "aptrepo=$root" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--project-name` must match the Pages project so the site lives at
          # https://chattersyn-apt.pages.dev (the README install instructions
          # point there). Rename here + in apt/README.md to move it.
          # `--branch=main` forces production: on a tag push the checkout is a
          # detached HEAD, so wrangler's git-branch detection would otherwise
          # deploy to a preview branch named after the tag instead of the live
          # site.
          command: pages deploy ${{ env.aptrepo }} --project-name=chattersyn-apt --branch=main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-repo-index
          path: ${{ env.aptrepo }}/dists
          if-no-files-found: ignore

  homebrew:
    # Publish the macOS cask into the Homebrew tap
    # (smitht06/homebrew-chattersyn, tapped as `smitht06/chattersyn`). The tap
    # is a plain git repo brew clones — no Pages/Cloudflare hosting. The
    # sha256 is computed from the REMOTE release asset (the exact bytes brew
    # will download), never the freshly rebuilt artifact: rebuilds are not
    # byte-identical, and a mismatch would fail `brew install`'s checksum
    # verification the same way the apt Size/SHA256 mismatch did. Also runs on
    # workflow_dispatch for smoke tests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, download LAST: a checkout run after the download
      # deleted artifacts/ despite clean: false (sparse-checkout worktree
      # update), so nothing git-flavored may run between the download and
      # the steps that read it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # No `pattern`: download all artifacts merged flat, exactly like the
          # release and apt-repo jobs. The `pattern` input was silently
          # matching nothing.
          path: artifacts
          merge-multiple: true

      - name: Locate macOS zip
        id: zip
        run: |
          echo "--- artifacts/ tree ---"
          find artifacts -type f | sort || true
          zip="$(find artifacts -name 'chattersyn-*-macos-arm64.zip' | head -1)"
          if [ -z "$zip" ]; then
            echo "FATAL: no chattersyn-*-macos-arm64.zip under artifacts/" >&2
            exit 1
          fi
          ver="$(basename "$zip" | sed 's/^chattersyn-//; s/-macos-arm64\.zip$//')"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Probe release asset (first hop, no -L)
        run: |
          set -euo pipefail
          ver="${{ steps.zip.outputs.ver }}"
          url="https://github.com/smitht06/red-chattersyn/releases/download/v${ver}/chattersyn-${ver}-macos-arm64.zip"
          # First hop only: github.com answers 302 for an existing asset and
          # 404 for a missing one; the CDN blob host can serve stale 404s and
          # rejects HEAD. On a tag push the `release` job uploads the asset in
          # parallel with this job — retry until it appears (or fail after
          # ~10 min; the tap then stays on the previous version, like the apt
          # repo).
          for _ in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "302" ]; then
              echo "release asset present (302)"
              exit 0
            fi
            echo "asset not up yet (HTTP $code), retrying in 10s"
            sleep 10
          done
          echo "FATAL: release asset never appeared at $url" >&2
          exit 1

      - name: Hash remote release asset
        id: sha
        run: |
          set -euo pipefail
          ver="${{ steps.zip.outputs.ver }}"
          url="https://github.com/smitht06/red-chattersyn/releases/download/v${ver}/chattersyn-${ver}-macos-arm64.zip"
          mkdir -p "$RUNNER_TEMP/remote"   # mkdir before curl -o writes into it
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 3 -o "$RUNNER_TEMP/remote/chattersyn.zip" "$url"; then
              break
            fi
            echo "download attempt $attempt failed (stale CDN 404?), retrying in 10s"
            sleep 10
          done
          sha="$(sha256sum "$RUNNER_TEMP/remote/chattersyn.zip" | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Generate cask
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tap"
          python3 scripts/gen_cask.py \
              "${{ steps.zip.outputs.ver }}" "${{ steps.sha.outputs.sha256 }}" "$RUNNER_TEMP/tap"
          echo "tap=$RUNNER_TEMP/tap" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/tap/Casks/chattersyn.rb"

      - name: Set up tap deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Push cask to tap repo
        run: |
          set -euo pipefail
          clone="$RUNNER_TEMP/taprepo"
          git clone --depth 1 git@github.com:smitht06/homebrew-chattersyn.git "$clone"
          cp "$RUNNER_TEMP/tap/Casks/chattersyn.rb" "$clone/Casks/chattersyn.rb"
          cp "$RUNNER_TEMP/tap/README.md" "$clone/README.md"
          cd "$clone"
          git add -A
          if git diff --cached --quiet; then
            echo "tap already up to date, nothing to push"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chattersyn ${{ steps.zip.outputs.ver }}"
          git pull --rebase origin main
          git push origin main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homebrew-cask
          path: ${{ env.tap }}/Casks
          if-no-files-found: ignore

  site:
    # The homepage, privacy policy and terms at
    # https://chattersyn.redcyberdragon.net (Cloudflare Pages project
    # chattersyn-site; the custom domain is attached once in the Cloudflare
    # dashboard). Google's OAuth consent screen links to the privacy policy,
    # so the site deploys from main and must stay true to what the app does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site"
          cp -R site "$out"
          # The same pictures as the app and its Flathub listing.
          cp packaging/flatpak/screenshots/main.png "$out/screenshot.png"
          cp src/chattersyn/assets/icon.png "$out/icon.png"
          echo "site=$out" >> "$GITHUB_ENV"

      - name: Create the Pages project (first deploy only)
        # Fails harmlessly once the project exists.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create chattersyn-site --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main: production, as for the APT repo.
          command: pages deploy ${{ env.site }} --project-name=chattersyn-site --branch=main

  flatpak:
    # Builds the Flathub package from this checkout and lints it the way
    # Flathub does (packaging/flatpak/README.md). The x86_64 bundle is a CI
    # artifact for testing: flatpak install --user chattersyn-x86_64.flatpak
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: chattersyn-x86_64.flatpak
          manifest-path: packaging/flatpak/net.redcyberdragon.ChatterSyn.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/python3-*.json') }}
          # Like Flathub's builders: copy the store screenshots into the build,
          # which the repo lint below requires.
          mirror-screenshots-url: https://dl.flathub.org/media

      - name: Lint the way Flathub does
        run: |
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          # --filesystem: the linter runs sandboxed and can't see the checkout otherwise.
          flatpak run --filesystem="$PWD" --command=flatpak-builder-lint org.flatpak.Builder \
              manifest packaging/flatpak/net.redcyberdragon.ChatterSyn.yml
          flatpak run --filesystem="$PWD" --command=flatpak-builder-lint org.flatpak.Builder repo repo
